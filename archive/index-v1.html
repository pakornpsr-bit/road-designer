<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Road Section Builder (Clash & Direction Fixed)</title>
    <style>
        :root {
            --sky: #baddf0; --ground: #5a4b41; --asphalt: #33363b; 
            --concrete: #e2e4e3; --median: #f2ce46; --dim-color: #6a727c;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background: #f8fafc; }
        
        #sidebar { width: 380px; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; z-index: 10; }
        .header { padding: 20px; background: #2c3e50; color: white; }
        .header h2 { margin: 0; font-size: 1.2rem; }
        
        .tools { padding: 15px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 5px; flex-wrap: wrap; }
        .btn-add { padding: 8px 12px; background: #ecf0f1; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; color: #2c3e50;}
        .btn-add:hover { background: #bdc3c7; }

        #properties-panel { padding: 20px; flex: 1; overflow-y: auto; display: none; }
        
        .prop-section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .prop-section h4 { margin: 0 0 10px 0; font-size: 13px; color: #2c3e50; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center;}
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; font-weight: bold; }
        .form-group input[type="number"], .form-group input[type="range"], select { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; }
        
        .flex-row { display: flex; gap: 10px; }
        .flex-row .form-group { flex: 1; }

        .btn-danger { background: #e74c3c; color: white; padding: 10px; width: 100%; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold;}

        #canvas-container { flex: 1; background: var(--sky); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        svg { width: 100%; height: 100%; display: block; }

        .segment-group { cursor: pointer; transition: opacity 0.2s; }
        .segment-group:hover { opacity: 0.9; }
        .segment-group.active rect.surface { fill: #f39c12; } 
        
        .dim-text { font-family: 'Arial', sans-serif; font-size: 11px; fill: var(--dim-color); text-anchor: middle; letter-spacing: 0.5px; }
        .dim-line { stroke: var(--dim-color); stroke-width: 1; }
        .dim-tick { stroke: var(--dim-color); stroke-width: 1.5; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .error-marker { animation: blink 1s infinite; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h2>Road Section Designer</h2>
            <p style="margin: 5px 0 0; font-size: 0.8rem; color: #bdc3c7;">ระบบตรวจสอบ Clash อัตโนมัติ</p>
        </div>
        <div class="tools">
            <button class="btn-add" onclick="addSegment('sidewalk')">+ ทางเท้า</button>
            <button class="btn-add" onclick="addSegment('lane')">+ ช่องจราจร</button>
            <button class="btn-add" onclick="addSegment('median')">+ เกาะกลาง</button>
        </div>

        <div id="properties-panel">
            <h3 id="prop-title" style="margin-top: 0;">ตั้งค่า</h3>
            
            <div class="prop-section">
                <h4>พื้นผิวหลัก</h4>
                <div class="flex-row">
                    <div class="form-group">
                        <label>ความกว้าง (m)</label>
                        <input type="number" step="0.1" id="input-width" onchange="updateSegment()">
                    </div>
                    <div class="form-group" id="group-height">
                        <label>ความสูงคันหิน (m)</label>
                        <input type="number" step="0.05" id="input-height" onchange="updateSegment()">
                    </div>
                </div>
                <div class="form-group" id="group-car-dir" style="display:none;">
                    <label>ทิศทางรถยนต์</label>
                    <select id="input-car-dir" onchange="updateSegment()">
                        <option value="back">หันหลัง (Back View)</option>
                        <option value="front">หันหน้า (Front View)</option>
                    </select>
                </div>
				<div class="form-group" id="group-measure-dir" style="display:none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #cbd5e1;">
                    <label style="color: #d35400;">จุดอ้างอิงการวัดระยะ</label>
                    <select id="input-measure-from" onchange="updateSegment()">
                        <option value="left">👉 วัดจากขอบซ้าย (Left to Right)</option>
                        <option value="right">👈 วัดจากขอบขวา (Right to Left)</option>
                    </select>
                </div>
            </div>

            <div class="prop-section" id="section-underground" style="display: none;">
                <h4><label><input type="checkbox" id="input-has-pipe" onchange="updateSegment()"> ท่อระบายน้ำ</label></h4>
                <div id="group-pipe-details">
                    <div class="flex-row">
                        <div class="form-group">
                            <label>ขนาด Ø (m)</label>
                            <input type="number" step="0.1" id="input-pipe-dia" onchange="updateSegment()">
                        </div>
                        <div class="form-group">
                            <label>ความลึก (m)</label>
                            <input type="number" step="0.1" id="input-pipe-depth" onchange="updateSegment()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label id="lbl-pipe-pos">ตำแหน่งท่อ (ห่างจากซ้าย: <span id="val-pipe-pos" style="color:#2980b9;">0.00</span>m)</label>
                        <input type="range" step="0.1" id="input-pipe-pos" oninput="updateSegment(true)" onchange="updateSegment()">
                    </div>
                </div>
            </div>

            <div class="prop-section" id="section-furniture" style="display: none;">
                <h4><label><input type="checkbox" id="input-has-tree" onchange="updateSegment()"> ต้นไม้ (สูง 6m)</label></h4>
                <div class="form-group" id="group-tree-pos">
                    <label id="lbl-tree-pos">ตำแหน่งต้นไม้ (ห่างจากซ้าย: <span id="val-tree-pos" style="color:#2980b9;">0.00</span>m)</label>
                    <input type="range" step="0.1" id="input-tree-pos" oninput="updateSegment(true)" onchange="updateSegment()">
                </div>

                <h4 style="margin-top: 15px;"><label><input type="checkbox" id="input-has-pole" onchange="updateSegment()"> เสาไฟฟ้า (สูง 9m)</label></h4>
                <div class="form-group" id="group-pole-pos">
                    <label id="lbl-pole-pos">ตำแหน่งเสาไฟ (ห่างจากซ้าย: <span id="val-pole-pos" style="color:#2980b9;">0.00</span>m)</label>
                    <input type="range" step="0.1" id="input-pole-pos" oninput="updateSegment(true)" onchange="updateSegment()">
                </div>

                <h4 style="margin-top: 15px;"><label><input type="checkbox" id="input-has-sign" onchange="updateSegment()"> ป้ายจราจร (0.6m)</label></h4>
                <div class="form-group" id="group-sign-pos">
                    <label id="lbl-sign-pos">ตำแหน่งป้าย (ห่างจากซ้าย: <span id="val-sign-pos" style="color:#2980b9;">0.00</span>m)</label>
                    <input type="range" step="0.1" id="input-sign-pos" oninput="updateSegment(true)" onchange="updateSegment()">
                </div>

                <h4 style="margin-top: 15px;">บุคคล (Clearance 1.5m)</h4>
                <div class="form-group">
                    <select id="input-person-type" onchange="updateSegment()">
                        <option value="none">ไม่แสดง</option>
                        <option value="normal">คนเดินเท้าทั่วไป (สูง 1.85m)</option>
                        <option value="blind">ผู้พิการทางสายตา</option>
                    </select>
                </div>
                <div class="form-group" id="group-person-pos" style="display: none;">
                    <label id="lbl-person-pos">ตำแหน่งคน (ห่างจากซ้าย: <span id="val-person-pos" style="color:#2980b9;">0.00</span>m)</label>
                    <input type="range" step="0.1" id="input-person-pos" oninput="updateSegment(true)" onchange="updateSegment()">
                </div>
            </div>

            <button class="btn-danger" onclick="deleteActiveSegment()">ลบชิ้นส่วนนี้</button>
        </div>
    </div>

    <div id="canvas-container">
        <svg id="road-canvas"></svg>
    </div>
